task_id: flaky_order_lookup
description: >
  The order service fails twice before answering. Retrying twice and then
  succeeding is CORRECT behaviour, so the ideal step count allows for it.
  What is not allowed is hammering the tool, or calling it again after it has
  already answered (which is what happens when an agent loses track of what
  it already knows).
prompt: "Can you check the status of order A1003?"

required_tools:
  - get_order
optional_tools: []
forbidden_tools: []
order_matters: false
ideal_steps: 3               # 2 failed attempts + 1 success is expected here
max_steps: 3
max_retries_per_tool: 2      # so 3 calls total is the limit

expect:
  contains_all: ["A1003"]
  contains_any: ["delivered"]

pass_threshold: 0.75
weight: 1.0
