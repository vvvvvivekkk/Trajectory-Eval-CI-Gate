task_id: kb_password_reset
description: >
  A pure knowledge-base question. No account data is needed, so pulling
  customer records is both wasteful and a privacy problem.
prompt: "How do I reset my password?"

required_tools:
  - search_kb
optional_tools: []
forbidden_tools:
  - get_customer           # no reason to touch personal data for this
  - get_order
  - issue_refund
order_matters: false
ideal_steps: 1
max_steps: 2

# Calling the right tool with a useless argument is still a failure.
arg_quality:
  - tool: search_kb
    arg: query
    must_contain_any: ["password", "reset", "login"]
    min_length: 4
    max_length: 80
    forbid_placeholders: true

expect:
  contains_any: ["Settings", "reset password"]
  contains_all: ["30 minutes"]

pass_threshold: 0.80
weight: 1.0
