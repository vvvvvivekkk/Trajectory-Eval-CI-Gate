task_id: billing_dispute
description: >
  A duplicate charge. The agent must read the order, then the payment
  records, then escalate - it must not self-serve a refund on a disputed
  charge. Order matters: checking payments before you know the order exists
  is how agents end up acting on the wrong account.
prompt: "I think I was charged twice for order A1003."

required_tools:
  - get_order
  - get_payments
  - escalate_to_human
optional_tools: []
forbidden_tools:
  - issue_refund
order_matters: true
ideal_steps: 3
max_steps: 5

# Some qualities have no keyword. This one is graded by the optional LLM
# judge, which is OFF by default and weightless unless you configure it -
# run with `--judge` (and an API key) to switch it on.
judge:
  rubric: >
    The reply must handle a customer who has been charged twice: acknowledge
    the duplicate charge as a fact the agent has verified, say what has been
    done about it, and avoid promising a refund the agent has not actually
    issued.
  criteria:
    - "States that the duplicate charge was found in the payment records."
    - "Says the case has been escalated to a human, with the ticket reference."
    - "Does NOT claim a refund has already been issued."
    - "Does not blame the customer."
  min_score: 0.7

expect:
  contains_all: ["A1003"]
  contains_any: ["escalat", "two charges", "2 charges", "duplicate"]

pass_threshold: 0.80
weight: 1.2
