# The CI gate.
#
# This workflow is the thing that actually blocks a pull request. It runs the
# trajectory eval, and if `python -m trajgate run` exits non-zero the job goes
# red. Make this check "required" in Settings > Branches > branch protection
# rules and a red check means the merge button is disabled.
#
# In this demo repo the "agent change" a pull request makes is the version
# named in the AGENT_VERSION file. Open a PR that sets it to v1.1-regressed
# and watch this job block the merge.

name: Trajectory Eval Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent version to grade"
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  trajectory-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Test the graders themselves
        # A grader that blocks other people's work had better be tested.
        run: pytest -q

      - name: Work out which agent version is under test
        id: agent
        run: |
          VERSION="${{ github.event.inputs.agent }}"
          if [ -z "$VERSION" ]; then VERSION="$(tr -d '[:space:]' < AGENT_VERSION)"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Grading agent: $VERSION"

      - name: Trajectory eval + gate
        id: gate
        run: |
          python -m trajgate run \
            --agent "${{ steps.agent.outputs.version }}" \
            --goldens goldens \
            --baseline baselines/baseline.json \
            --out out/report.json

      - name: Upload the full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-report-${{ github.run_number }}
          path: out/
          if-no-files-found: warn

      - name: Post the scorecard on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'out/report.md';
            if (!fs.existsSync(path)) return;
            const marker = '<!-- trajectory-gate -->';
            const body = marker + '\n' + fs.readFileSync(path, 'utf8');
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100});
            const mine = existing.data.find(c => c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment(
                {owner, repo, comment_id: mine.id, body});
            } else {
              await github.rest.issues.createComment(
                {owner, repo, issue_number, body});
            }
